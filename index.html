<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jon Goohs — Navy cyber officer, NPS graduate researcher, and contributor to the SUMO/ontologyportal ecosystem."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Jon Goohs</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jonathan Goohs",
        "url": "https://jon-goohs-portfolio.vercel.app",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "Naval Postgraduate School"
        },
        "sameAs": [
          "https://github.com/jdev-02",
          "https://gooselinesolutions.com"
        ]
      }
    </script>
    <script>
      // Blocking, runs before first paint -- sets data-theme synchronously
      // so the page never paints light-mode defaults and then flashes to
      // dark once React's useSyncExternalStore effect catches up
      // (code-review flagged the flash; useTheme.ts owns this same logic
      // for every render after this first one).
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* private mode / blocked storage -- CSS's prefers-color-scheme fallback still applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
